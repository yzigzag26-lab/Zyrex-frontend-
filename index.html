<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080A0F" />
    <meta
      name="description"
      content="HERMES AI — private AI-assisted financial analysis and trading."
    />
    <link rel="icon" href="/hermes-logo.jpg" type="image/jpeg" />
    <link rel="apple-touch-icon" href="/hermes-logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>HERMES AI</title>
    <script>
      try {
        var stored = localStorage.getItem("hermes.theme");
        var theme = stored ? JSON.parse(stored) : "dark";
        if (theme === "system") {
          theme =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        }
        document.documentElement.classList.toggle("dark", theme !== "light");
        document.documentElement.classList.toggle("light", theme === "light");
        document.documentElement.style.colorScheme = theme === "light" ? "light" : "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
