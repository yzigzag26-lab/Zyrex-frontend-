<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080A0F" />
    <meta
      name="description"
      content="HERMES AI — private AI-assisted financial analysis and trading."
    />
    <!-- Inline SVG favicon: the Wasmer deployment serves this single HTML
         file with no sibling assets, so an absolute-path icon href
         404-looped in the server logs on every load. A data URI never
         triggers a network fetch. (The in-app brand logo is unaffected —
         it is bundled into the JS as a data URI by the build.) -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23080A0F'/><text x='32' y='44' font-family='Arial,sans-serif' font-size='36' font-weight='700' fill='%23D4AF37' text-anchor='middle'>H</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>HERMES AI</title>
    <script>
      try {
        var stored = localStorage.getItem("hermes.theme");
        var theme = stored ? JSON.parse(stored) : "dark";
        if (theme === "system") {
          theme =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        }
        document.documentElement.classList.toggle("dark", theme !== "light");
        document.documentElement.classList.toggle("light", theme === "light");
        document.documentElement.style.colorScheme = theme === "light" ? "light" : "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
